<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happiest Birthday Henu 🌸</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Floating Petals Canvas Background -->
  <canvas id="petals-canvas"></canvas>

  <!-- Background Music -->
  <audio id="bg-music" loop preload="auto">
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <div class="app-container">

    <!-- SCREEN 1: TOUCH THE BLOSSOM -->
    <div class="screen active" id="screen-blossom">
      <div class="blossom-wrapper" onclick="unlockBlossom()">
        <div class="blossom-flower">🌸</div>
        <p class="blossom-text">Touch the blossom</p>
      </div>
    </div>

    <!-- SCREEN 2: PASSCODE KEYPAD -->
    <div class="screen" id="screen-passcode">
      <div class="card passcode-card tilt-card">
        <div class="card-flower">🌸</div>
        <h2 class="passcode-title">For my love</h2>
        <p class="passcode-subtitle">Happiest Birthday ✨</p>

        <div class="pin-dots">
          <span class="dot" id="dot-0"></span>
          <span class="dot" id="dot-1"></span>
          <span class="dot" id="dot-2"></span>
          <span class="dot" id="dot-3"></span>
        </div>

        <p class="passcode-hint">Hint: What's the date today? 🗓️</p>

        <div class="keypad">
          <button onclick="pressKey('1')">1</button>
          <button onclick="pressKey('2')">2</button>
          <button onclick="pressKey('3')">3</button>
          <button onclick="pressKey('4')">4</button>
          <button onclick="pressKey('5')">5</button>
          <button onclick="pressKey('6')">6</button>
          <button onclick="pressKey('7')">7</button>
          <button onclick="pressKey('8')">8</button>
          <button onclick="pressKey('9')">9</button>
          <button class="empty-key"></button>
          <button onclick="pressKey('0')">0</button>
          <button class="back-key" onclick="deleteKey()">⌫</button>
        </div>
      </div>
    </div>

    <!-- SCREEN 3: INTRO SURPRISE QUESTION -->
    <div class="screen" id="screen-intro">
      <div class="card intro-card tilt-card">
        <div class="decorative-hearts">🌸 💖 🌸</div>
